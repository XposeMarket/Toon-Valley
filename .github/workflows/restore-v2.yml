name: Restore exact Toon Valley v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore and verify exact source files
        shell: bash
        run: |
          set -euo pipefail
          cat .github/restore-v2/game.b64.* | base64 --decode | gzip --decompress > game.js
          base64 --decode .github/restore-v2/run.b64 | gzip --decompress > run-mac.command
          chmod +x run-mac.command

          test "$(wc -c < game.js | tr -d ' ')" = "64943"
          test "$(sha256sum game.js | awk '{print $1}')" = "dad85be820a1685cba09ac6db5afae9eda08a95c46d76ead977717c41369136a"
          test "$(sha256sum run-mac.command | awk '{print $1}')" = "21da630e0fbba846adb1fe7d5b2ba20e13021928bffde12738724c3508bedb68"

          git config user.name "XposeMarket"
          git config user.email "xposemarket@gmail.com"
          git add game.js run-mac.command
          git commit -m "Restore exact Toon Valley town v2 source"
          git push origin HEAD:main
