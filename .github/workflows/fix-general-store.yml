name: Fix General Store Interior

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-general-store.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch safe interior spawning and recovery
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Verify patch
        run: |
          set -euo pipefail
          node --check game.js
          node --check life.js
          node --check tests/smoke.mjs
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          node tests/smoke.mjs
      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name 'Toon Valley Builder'
          git config user.email 'xposemarket@gmail.com'
          git add game.js life.js tests/smoke.mjs
          git commit -m 'Fix trapped General Store interior spawn'
          git push
