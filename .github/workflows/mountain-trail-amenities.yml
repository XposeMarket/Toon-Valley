name: Mountain Trail Amenities

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: mountain-trail-amenities-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax checks
        run: |
          node --check mountain-trail-amenities.js
          node --check tests/mountain-trail-amenities-runtime.mjs
      - name: Install browser runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Local trail amenities gameplay test
        run: timeout 150s node tests/mountain-trail-amenities-runtime.mjs
      - name: Production trail amenities gameplay test
        if: github.event_name == 'push'
        env:
          BASE_URL: https://toon-valley.vercel.app
        run: timeout 150s node tests/mountain-trail-amenities-runtime.mjs
