name: Notice Board Physical Lifecycle

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: toon-valley-notice-board-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-notice-board:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax checks
        run: |
          node --check valley-routines.js
          node --check side-quest-routine-bridge.js
          node --check tests/notice-board-physical-runtime.mjs
          node tests/valley-routines-static.mjs
      - name: Install browser runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Local physical notice-board lifecycle
        run: timeout 150s node tests/notice-board-physical-runtime.mjs
      - name: Production physical notice-board lifecycle
        if: github.event_name == 'push'
        env:
          BASE_URL: https://toon-valley.vercel.app
        run: timeout 150s node tests/notice-board-physical-runtime.mjs
