name: Toon Valley Town Polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/town-polish.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply town polish patch
        run: cat .patches/town-polish.b64.* | tr -d '\n' | base64 -d > /tmp/town-polish.py && python /tmp/town-polish.py

      - name: Verify JavaScript and browser gameplay
        run: |
          set -euo pipefail
          node --check game.js
          node --check life.js
          node --check tests/smoke.mjs
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          node tests/smoke.mjs

      - name: Commit verified changes
        run: |
          set -euo pipefail
          git config user.name 'Toon Valley Builder'
          git config user.email 'xposemarket@gmail.com'
          git add game.js life.js style.css index.html sw.js tests/smoke.mjs
          git commit -m 'Fix controls seating market and town layout'
          git push
