name: Ambient Pedestrian Regression

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: toon-valley-ambient-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-ambient-life:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax checks
        run: |
          node --check ambient-pedestrian-life.js
          node --check town-square-street-life.js
          node --check ambient-world-details.js
          node --check tests/ambient-pedestrian-runtime.mjs
          node --check tests/town-square-street-life-runtime.mjs
          node --check tests/ambient-world-details-runtime.mjs
      - name: Install browser runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Local ambient pedestrian runtime
        run: |
          timeout 150s node tests/ambient-pedestrian-runtime.mjs
          timeout 150s node tests/town-square-street-life-runtime.mjs
          timeout 150s node tests/ambient-world-details-runtime.mjs
      - name: Production ambient pedestrian runtime
        if: github.event_name == 'push'
        env:
          BASE_URL: https://toon-valley.vercel.app
        run: |
          timeout 150s node tests/ambient-pedestrian-runtime.mjs
          timeout 150s node tests/town-square-street-life-runtime.mjs
          timeout 150s node tests/ambient-world-details-runtime.mjs
