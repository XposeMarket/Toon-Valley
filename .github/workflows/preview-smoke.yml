name: Toon Valley Preview Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/preview-smoke.yml'

jobs:
  verify-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/smoke.mjs
        env:
          BASE_URL: https://toon-valley-5km1fmj2z-xpose-markets-projects.vercel.app/?_vercel_share=5bzm7SOcjgmNYrGn7nwnqwYiq9W3msgI
