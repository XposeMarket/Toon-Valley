name: Bluebell Wildlife Regression

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: toon-valley-bluebell-wildlife-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax checks
        run: |
          node --check bluebell-wildlife.js
          node --check tests/bluebell-wildlife-runtime.mjs
      - name: Install browser runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Local Bluebell wildlife runtime
        run: timeout 150s node tests/bluebell-wildlife-runtime.mjs
      - name: Production Bluebell wildlife runtime
        if: github.event_name == 'push'
        env:
          BASE_URL: https://toon-valley.vercel.app
        run: timeout 150s node tests/bluebell-wildlife-runtime.mjs
