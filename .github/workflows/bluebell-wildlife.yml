name: Bluebell Wildlife Regression

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: toon-valley-bluebell-wildlife-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax checks
        run: |
          node --check bluebell-wildlife.js
          node --check bluebell-wildlife-polish.js
          node --check bluebell-wildlife-social.js
          node --check bluebell-wildlife-cohesion.js
          node --check bluebell-shore-life.js
          node --check bluebell-marsh-life.js
          node --check bluebell-ecosystem-links.js
          node --check tests/bluebell-wildlife-runtime.mjs
          node --check tests/bluebell-wildlife-polish-runtime.mjs
          node --check tests/bluebell-wildlife-social-runtime.mjs
          node --check tests/bluebell-wildlife-cohesion-runtime.mjs
          node --check tests/bluebell-shore-life-runtime.mjs
          node --check tests/bluebell-ecosystem-links-runtime.mjs
      - name: Install browser runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Local Bluebell wildlife runtime
        run: timeout 150s node tests/bluebell-wildlife-runtime.mjs
      - name: Local Bluebell wildlife polish runtime
        run: timeout 150s node tests/bluebell-wildlife-polish-runtime.mjs
      - name: Local Bluebell wildlife social runtime
        run: timeout 150s node tests/bluebell-wildlife-social-runtime.mjs
      - name: Local Bluebell wildlife cohesion runtime
        run: timeout 150s node tests/bluebell-wildlife-cohesion-runtime.mjs
      - name: Local Bluebell shoreline life runtime
        run: timeout 150s node tests/bluebell-shore-life-runtime.mjs
      - name: Local Bluebell ecosystem links runtime
        run: timeout 150s node tests/bluebell-ecosystem-links-runtime.mjs
      - name: Production Bluebell wildlife runtime
        if: github.event_name == 'push'
        env:
          BASE_URL: https://toon-valley.vercel.app
        run: timeout 150s node tests/bluebell-wildlife-runtime.mjs
      - name: Production Bluebell wildlife polish runtime
        if: github.event_name == 'push'
        env:
          BASE_URL: https://toon-valley.vercel.app
        run: timeout 150s node tests/bluebell-wildlife-polish-runtime.mjs
      - name: Production Bluebell wildlife social runtime
        if: github.event_name == 'push'
        env:
          BASE_URL: https://toon-valley.vercel.app
        run: timeout 150s node tests/bluebell-wildlife-social-runtime.mjs
      - name: Production Bluebell wildlife cohesion runtime
        if: github.event_name == 'push'
        env:
          BASE_URL: https://toon-valley.vercel.app
        run: timeout 150s node tests/bluebell-wildlife-cohesion-runtime.mjs
      - name: Production Bluebell shoreline life runtime
        if: github.event_name == 'push'
        env:
          BASE_URL: https://toon-valley.vercel.app
        run: timeout 150s node tests/bluebell-shore-life-runtime.mjs
      - name: Production Bluebell ecosystem links runtime
        if: github.event_name == 'push'
        env:
          BASE_URL: https://toon-valley.vercel.app
        run: timeout 150s node tests/bluebell-ecosystem-links-runtime.mjs
