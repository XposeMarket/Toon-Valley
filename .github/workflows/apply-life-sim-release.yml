name: Apply Toon Valley life-sim release

on:
  push:
    paths:
      - '.github/release/**'
      - '.github/workflows/apply-life-sim-release.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify release
        shell: bash
        run: |
          set -euo pipefail
          cat .github/release/release.b64.0{0..8} .github/release/release.b64.09_{0..6} .github/release/release.b64.10 | base64 --decode > /tmp/toon-valley-life-sim.tgz
          echo '9456e90962233f28625b62725b2be906b025c46009b37a0ec5acf01d59b9cc8e  /tmp/toon-valley-life-sim.tgz' | sha256sum --check --strict
          tar -xzf /tmp/toon-valley-life-sim.tgz -C .

      - name: Correct and strengthen browser smoke test
        shell: python
        run: |
          from pathlib import Path
          path = Path('tests/smoke.mjs')
          source = path.read_text()
          source = source.replace(
              "  await page.click('#phone-button');",
              "  await page.click('#play-button');\n  await page.waitForFunction(() => window.ToonValley.state.started);\n  await page.click('#phone-button');",
              1,
          )
          source = source.replace(
              "() => window.ToonValleyLife && window.ToonValleyLife.getState().player.money === arguments[0]",
              "(expected) => window.ToonValleyLife && window.ToonValleyLife.getState().player.money === expected",
          )
          if "arguments[0]" in source:
              raise SystemExit('The invalid reload assertion was not removed.')
          if "page.click('#play-button')" not in source:
              raise SystemExit('The start-screen smoke-test step was not added.')
          path.write_text(source)

      - name: Triple static verification
        shell: bash
        run: |
          set -euo pipefail
          for pass in 1 2 3; do
            echo "Verification pass ${pass}"
            node --check game.js
            node --check life.js
            node --check sw.js
            node --check tests/smoke.mjs
            test -s index.html
            test -s style.css
            test -s life.css
            test -s manifest.webmanifest
            test -s icon.svg
            test -s vercel.json
            ! grep -RniE 'TODO|FIXME|placeholder|coming soon|not implemented|full build' --exclude-dir=.git --exclude-dir=.github --exclude='*.md' .
          done

      - name: Commit game files without workflow mutation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Toon Valley Builder'
          git config user.email 'xposemarket@gmail.com'
          git add README.md game.js icon.svg index.html life.css life.js manifest.webmanifest run-mac.command style.css sw.js tests/smoke.mjs vercel.json
          git commit -m 'Build Toon Valley life simulator'
          git push
