name: Toon Valley CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax checks
        run: |
          node --check game.js
          node --check life.js
          node --check sw.js
          node --check tests/smoke.mjs
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Local browser smoke test
        run: node tests/smoke.mjs
      - name: Production browser health check
        # This executes the same General Store entry/recovery/exit regression on the public deployment.
        env:
          BASE_URL: https://toon-valley.vercel.app
        run: node tests/smoke.mjs
