name: Toon Valley CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: toon-valley-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax checks
        run: |
          node --check game.js
          node --check life.js
          node --check pointer-capture-guard.js
          node --check ui-layer-fix.js
          node --check world-events.js
          node --check town-activities.js
          node --check valley-services.js
          node --check valley-routines.js
          node --check central-plaza.js
          node --check central-plaza-core.js
          node --check public-interiors.js
          node --check moonbeam-theater.js
          node --check owned-home.js
          node --check world-polish.js
          node --check bluebell-lake.js
          node --check interaction-world-fix.js
          node --check valley-transit.js
          node --check community-garden.js
          node --check valley-community-life.js
          node --check living-interiors.js
          node --check navigation-polish.js
          node --check side-quest-overhaul.js
          node --check side-quest-routine-bridge.js
          node --check neighborhood-quests.js
          node --check civic-quests.js
          node --check town-service-quests.js
          node --check indoor-service-quests.js
          node --check side-quest-ui.js
          node --check interaction-experience.js
          node --check side-quest-interaction-fix.js
          node --check swing-exit-fix.js
          node --check npc-building-life.js
          node --check mobile-polish.js
          node --check camera-experience-polish.js
          node --check movement-speed-polish.js
          node --check sw.js
          node --check tests/smoke.mjs
          node --check tests/mobile-smoke.mjs
          node --check tests/extensions-runtime.mjs
          node --check tests/npc-swing-runtime.mjs
          node --check tests/navigation-polish-runtime.mjs
          node --check tests/side-quests-runtime.mjs
          node --check tests/neighborhood-quests-runtime.mjs
          node --check tests/civic-quests-runtime.mjs
          node --check tests/town-service-quests-runtime.mjs
          node --check tests/indoor-service-quests-runtime.mjs
          node --check tests/community-life-runtime.mjs
          node --check tests/modal-popover-runtime.mjs
          node --check tests/navigation-polish-static.mjs
          node --check tests/production-extensions.mjs
          node --check tests/valley-expansion-static.mjs
          node --check tests/daily-build-static.mjs
          node --check tests/community-life-static.mjs
          node tests/world-events-static.mjs
          node tests/town-activities-static.mjs
          node tests/valley-services-static.mjs
          node tests/valley-routines-static.mjs
          node tests/central-plaza-static.mjs
          node tests/valley-expansion-static.mjs
          node tests/daily-build-static.mjs
          node tests/community-life-static.mjs
          node tests/navigation-polish-static.mjs
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Mobile browser smoke test
        run: timeout 150s node tests/mobile-smoke.mjs
      - name: World extension runtime test
        run: timeout 150s node tests/extensions-runtime.mjs
      - name: Swing and NPC building runtime test
        run: timeout 150s node tests/npc-swing-runtime.mjs
      - name: Navigation fishing and desktop UI runtime test
        run: timeout 150s node tests/navigation-polish-runtime.mjs
      - name: Multi-step side quest runtime test
        run: timeout 180s node tests/side-quests-runtime.mjs
      - name: Neighborhood multi-step quest runtime test
        run: timeout 150s node tests/neighborhood-quests-runtime.mjs
      - name: Civic multi-step quest runtime test
        run: timeout 150s node tests/civic-quests-runtime.mjs
      - name: Town service multi-step quest runtime test
        run: timeout 150s node tests/town-service-quests-runtime.mjs
      - name: Indoor service multi-step quest runtime test
        run: timeout 150s node tests/indoor-service-quests-runtime.mjs
      - name: Community trail and errand lifecycle test
        run: timeout 150s node tests/community-life-runtime.mjs
      - name: Modal and popover Pointer Lock lifecycle test
        run: HEADED=1 xvfb-run -a timeout 150s node tests/modal-popover-runtime.mjs
      - name: Local browser smoke test
        run: timeout 150s node tests/smoke.mjs
      - name: Production mobile browser check
        if: github.event_name == 'push'
        env:
          BASE_URL: https://toon-valley.vercel.app
        run: timeout 150s node tests/mobile-smoke.mjs
      - name: Production browser health check
        if: github.event_name == 'push'
        env:
          BASE_URL: https://toon-valley.vercel.app
        run: timeout 150s node tests/smoke.mjs
      - name: Production navigation fishing and desktop UI verification
        if: github.event_name == 'push'
        env:
          BASE_URL: https://toon-valley.vercel.app
        run: timeout 150s node tests/navigation-polish-runtime.mjs
      - name: Production multi-step side quest verification
        if: github.event_name == 'push'
        env:
          BASE_URL: https://toon-valley.vercel.app
        run: timeout 180s node tests/side-quests-runtime.mjs
      - name: Production neighborhood quest verification
        if: github.event_name == 'push'
        env:
          BASE_URL: https://toon-valley.vercel.app
        run: timeout 150s node tests/neighborhood-quests-runtime.mjs
      - name: Production civic quest verification
        if: github.event_name == 'push'
        env:
          BASE_URL: https://toon-valley.vercel.app
        run: timeout 150s node tests/civic-quests-runtime.mjs
      - name: Production town service quest verification
        if: github.event_name == 'push'
        env:
          BASE_URL: https://toon-valley.vercel.app
        run: timeout 150s node tests/town-service-quests-runtime.mjs
      - name: Production indoor service quest verification
        if: github.event_name == 'push'
        env:
          BASE_URL: https://toon-valley.vercel.app
        run: timeout 150s node tests/indoor-service-quests-runtime.mjs
      - name: Production community lifecycle verification
        if: github.event_name == 'push'
        env:
          BASE_URL: https://toon-valley.vercel.app
        run: timeout 150s node tests/community-life-runtime.mjs
      - name: Production modal and popover verification
        if: github.event_name == 'push'
        env:
          BASE_URL: https://toon-valley.vercel.app
          HEADED: '1'
        run: xvfb-run -a timeout 150s node tests/modal-popover-runtime.mjs
      - name: Production world extension verification
        if: github.event_name == 'push'
        env:
          BASE_URL: https://toon-valley.vercel.app
          EXPECTED_COMMIT: ${{ github.sha }}
        run: timeout 150s node tests/production-extensions.mjs
